<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__NOME__</title>
<meta name="description" content="__DESCRIZIONE__">
<meta name="theme-color" content="__COLORE__">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/icons.css">
<link rel="stylesheet" href="css/style.css">
<script>
  // Tema prima del primo disegno, per evitare il lampo di colori sbagliati.
  (() => { let t = "auto"; try { t = localStorage.getItem("__ID__:theme") || "auto"; } catch {}
    if (t === "auto") t = matchMedia("(prefers-contrast: more)").matches ? "contrast" : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t; })();
</script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<a class="skip" href="#main" data-i18n="ui.skip"></a>
<header class="bar">
  <button class="logo" id="logo" type="button" data-i18n-aria="mascot.label"></button>
  <h1 class="title">__NOME__</h1>
  <nav class="tools" data-i18n-aria="ui.tools">
    <button class="icon-btn" id="install" type="button" data-i18n-aria="ui.install" hidden><i class="ic ic-install" aria-hidden="true"></i></button>
    <button class="icon-btn" id="share" type="button" data-i18n-aria="ui.share"><i class="ic ic-share" aria-hidden="true"></i></button>
    <button class="icon-btn" id="music" type="button" data-i18n-aria="ui.music" aria-pressed="false" hidden><i class="ic ic-music-off" aria-hidden="true"></i></button>
    <button class="icon-btn" id="help" type="button" data-i18n-aria="ui.help"><i class="ic ic-help" aria-hidden="true"></i></button>
    <button class="icon-btn" id="settingsBtn" type="button" data-i18n-aria="ui.settings" aria-haspopup="dialog"><i class="ic ic-settings" aria-hidden="true"></i></button>
  </nav>
</header>

<main id="main" tabindex="-1">
  <section class="hero">
    <div class="mascot" id="mascot" role="button" tabindex="0" data-i18n-aria="mascot.tap"></div>
    <p class="bubble" id="bubble" aria-live="polite"></p>
  </section>

  <section class="card" id="listCard">
    <h2 data-i18n="home.title"></h2>
    <p class="muted" data-i18n="home.text"></p>
    <form id="add" class="row">
      <label class="sr" for="item" data-i18n="home.placeholder"></label>
      <input id="item" autocomplete="off" data-i18n-placeholder="home.placeholder">
      <button class="btn" type="submit"><i class="ic ic-plus" aria-hidden="true"></i><span data-i18n="home.add"></span></button>
    </form>
    <ul id="list" class="list"></ul>
    <p class="muted" id="count"></p>
  </section>
</main>

<footer class="foot">
  <span class="ver" id="ver"></span>
  <button class="link" id="legalBtn" type="button" data-i18n="legal.open"></button>
  <span data-i18n="ui.privacy"></span>
</footer>

<dialog id="settings" aria-labelledby="settingsT">
  <form method="dialog" class="sheet">
    <div class="sheet-head">
      <h2 id="settingsT" data-i18n="ui.settings"></h2>
      <button class="icon-btn" value="close" data-i18n-aria="ui.close"><i class="ic ic-close" aria-hidden="true"></i></button>
    </div>
    <label class="field"><span data-i18n="ui.language"></span><select id="lang"></select></label>
    <fieldset class="field">
      <legend data-i18n="theme.title"></legend>
      <div class="seg" id="themes">
        <label><input type="radio" name="theme" value="auto"><span><i class="ic ic-auto" aria-hidden="true"></i><span data-i18n="theme.auto"></span></span></label>
        <label><input type="radio" name="theme" value="light"><span><i class="ic ic-sun" aria-hidden="true"></i><span data-i18n="theme.light"></span></span></label>
        <label><input type="radio" name="theme" value="dark"><span><i class="ic ic-moon" aria-hidden="true"></i><span data-i18n="theme.dark"></span></span></label>
        <label><input type="radio" name="theme" value="contrast"><span><i class="ic ic-contrast" aria-hidden="true"></i><span data-i18n="theme.contrast"></span></span></label>
        <label><input type="radio" name="theme" value="cb"><span><i class="ic ic-eye" aria-hidden="true"></i><span data-i18n="theme.cb"></span></span></label>
      </div>
    </fieldset>
    <fieldset class="field">
      <legend data-i18n="backup.title"></legend>
      <div class="btns start">
        <button class="btn soft" type="button" id="exportBtn"><i class="ic ic-install" aria-hidden="true"></i><span data-i18n="backup.export"></span></button>
        <button class="btn soft" type="button" id="importBtn"><i class="ic ic-upload" aria-hidden="true"></i><span data-i18n="backup.import"></span></button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
    </fieldset>
    <label class="check" id="statsRow"><input type="checkbox" id="stats"><span data-i18n="usage.toggle"></span></label>
    <div class="btns">
      <button class="btn soft" type="button" id="tourAgain"><i class="ic ic-help" aria-hidden="true"></i><span data-i18n="tour.again"></span></button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
