name: Claude
# Scrivi «@claude …» in una issue, una PR o un commento: Claude lavora sul repo con gli agenti e le skill di .claude/.
# Serve il secret CLAUDE_CODE_OAUTH_TOKEN (claude setup-token) oppure ANTHROPIC_API_KEY.
on:
  issue_comment: { types: [created] }
  pull_request_review_comment: { types: [created] }
  issues: { types: [opened, assigned] }
permissions: { contents: write, pull-requests: write, issues: write, id-token: write, actions: read }
jobs:
  claude:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
